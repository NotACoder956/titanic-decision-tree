[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanic-decision-tree"
version = "1.0.0"
description = "An interpretable Titanic survival classifier using Pandas and scikit-learn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "nbformat>=5.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
